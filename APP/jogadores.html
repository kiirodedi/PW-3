<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogadores da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
    body { background-color: #121212; color: white; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
    
    .card-selecao, .card-jogador { 
        border: 1px solid #444; 
        border-radius: 8px; 
        padding: 15px; 
        text-align: center; 
        background-color: #1e1e1e; 
        color: white; 
        transition: transform 0.2s;
    }   

    .card-jogador img { 
        width: 100%; 
        height: 180px; 
        object-fit: cover;
        border-radius: 4px; 
        margin-bottom: 10px; 
    }
</style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center text-white">Gerenciador de Jogadores</h1>
        <hr>

        <div class="card p-4 mb-4 bg-dark text-white border-secondary">
            <h3>Cadastrar Novo Jogador</h3>
            <form  id="form-cadastro">
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">N° da camisa</label>
                    <input type="text" id="camisa" class="form-control" required>
                </div>
                    <div class="mb-3">
                    <label class="form-label">Posição</label>
                    <input type="text" id="posicao" class="form-control" required>
                </div>
                    <div class="mb-3">
                    <label class="form-label">Quantidade de gols</label>
                    <input type="text" id="gols" class="form-control" required>
                </div>
                    <div class="mb-3">
                    <label class="form-label">URL da foto do jogador</label>
                    <input type="text" id="foto" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Salvar Jogador</button>
            </form>
        </div>

        <div id="lista-jogadores" class="grid-cards"></div>

        <script>
            const base_url = "http://localhost:3000";
            const container = document.getElementById('lista-jogadores');

            function buscarJogadores() {
                fetch(`${base_url}/jogadores`)
                .then(res => res.json())
                .then(dados => {
                    container.innerHTML = "";
                    dados.forEach(jogador => {
                        const card = document.createElement('div');
                        card.className = "card-jogador"
                        card.innerHTML = `
                            <img src="${jogador.img}">
                            <h3>${jogador.nome}</h3>
                            <p>${jogador.posicao} - Camisa ${jogador.camisa}</p>
                            <p>${jogador.gols} gols marcados</p>

                            <button onclick="excluirJogador('${jogador.id}')" class="btn btn-danger btn-sm w-100">Excluir</button>
                        `;

                        container.appendChild(card);
                    })
                })
            }

            // FUNÇÃO PARA CADASTRAR
            document.getElementById('form-cadastro').addEventListener('submit', function(e) {
                e.preventDefault();

                const novoJogador = {
                    nome: document.getElementById('nome').value,
                    img: document.getElementById('foto').value,
                    posicao: document.getElementById('posicao').value,
                    camisa: document.getElementById('camisa').value,
                    gols: document.getElementById('gols').value,
                    selecaoId: "1b82"
                };

                fetch(`${base_url}/jogadores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoJogador)
                }).then(() => {
                    this.reset();
                    buscarJogadores();
                });
            });

            // FUNÇÃO PARA EXCLUIR
            function excluirJogador(id) {
                if(confirm("Tem certeza que deseja excluir esse jogador?")) {
                    fetch(`${base_url}/jogadores/${id}`, {
                        method: 'DELETE'
                    })

                    .then(() => {
                        buscarJogadores();
                    })
                }
            }

            // INICIALIZAÇÃO
            buscarJogadores();
        </script>
    </div>
</body>
</html>
