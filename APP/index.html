<!DOCTYPE html>
	<html lang="pt-BR">
	<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Copa do Mundo</title>
	<!-- Bootstrap -->

	<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	/>

	</head>

	<body>
		<h1>Página Inicial</h1>
		<ul id="lista-selecoes"></ul> <script>
    let base_url = "http://localhost:3000";
    const lista = document.getElementById('lista-selecoes');

    fetch(`${base_url}/selecoes`)
        .then(response => response.json())
        .then(dados => {
            // Limpa a lista antes de preencher
            lista.innerHTML = ""; 
            
            // Cria um item para cada seleção que vier da API
            dados.forEach(selecao => {
                const li = document.createElement('li');
                li.textContent = selecao.nome; // Supondo que o campo no seu db.json se chame "nome"
                lista.appendChild(li);
            });
        })
        .catch(error => console.log('Erro ao carregar:', error));
</script>
	</body>
	</html>
